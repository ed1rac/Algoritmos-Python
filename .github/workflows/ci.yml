name: CI Algoritmos Python

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: 📥 Clonar Repositório
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          **/requirements*.txt

    - name: 📦 Instalar Dependências de Teste
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: 🔍 Validar Sintaxe de Todos os Scripts (Byte-Compile)
      run: |
        python -m compileall -q .

    - name: 🧪 Executar Testes Unitários
      run: |
        python -m unittest discover -s busca_competitiva -p "*test*.py"
